name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Dependencias Dart
        run: flutter pub get

      - name: Firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Faltan secretos de firma: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS o ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  publicar:
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artefactos

      - name: Versión del proyecto
        id: version
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preparar assets
        run: |
          mkdir -p release
          APK="$(find artefactos -name 'app-release.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "No se encontró app-release.apk en los artefactos." >&2
            find artefactos -maxdepth 3 -type f >&2
            exit 1
          fi
          cp "$APK" release/tolochatracks.apk
          cd release
          sha256sum tolochatracks.apk > tolochatracks.apk.sha256

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes --title "TolochaTracks $TAG"
          fi
